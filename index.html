<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EyeFit - Vision Training</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8ff;
  color:#172033;
}
header{
  background:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  box-shadow:0 2px 10px #0001;
}
.logo{
  font-size:25px;
  font-weight:bold;
  color:#2864e8;
}
.hero{
  text-align:center;
  padding:45px 20px;
}
.hero h1{
  font-size:38px;
  margin:10px;
}
.hero p{
  color:#667085;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
  padding:20px;
  max-width:900px;
  margin:auto;
}
.card{
  background:white;
  padding:25px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 5px 20px #0001;
}
button{
  background:#2864e8;
  color:white;
  border:0;
  padding:12px 22px;
  border-radius:12px;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <div class="logo">👁️ EyeFit</div>
  <div>⚙️ Settings &nbsp; ❓ FAQ</div>
</header>

<section class="hero">
  <h1>Vision Training</h1>
  <p>Interactive exercises to practice visual skills</p>
</section>

<div class="grid">

<div class="card">
<h2>🔎 Search Quest</h2>
<p>Find and focus on visual targets.</p>
<button onclick="alert('Search Quest Started!')">Start</button>
</div>

<div class="card">
<h2>🎯 Focus Training</h2>
<p>Practice visual focus.</p>
<button onclick="alert('Focus Training Started!')">Start</button>
</div>

<div class="card">
<h2>🧠 Visual Memory</h2>
<p>Train your visual memory.</p>
<button onclick="alert('Visual Memory Started!')">Start</button>
</div>

<div class="card">
<h2>👀 Eye Tracking</h2>
<p>Follow visual targets.</p>
<button onclick="alert('Eye Tracking Started!')">Start</button>
</div>

</div>

</body>
</html>
